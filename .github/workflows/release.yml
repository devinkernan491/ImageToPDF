name: Build & Release Multi-Platform

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build macOS App & DMG
        run: |
          chmod +x build_app.sh create_dmg.sh
          ./create_dmg.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageToPDF-macOS-DMG
          path: ImageToPDF.dmg

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt

      - name: Build Standalone Windows .exe
        working-directory: windows
        run: |
          python build_exe.py

      - name: Rename Executable
        run: |
          move windows/dist/ImageToPDF.exe ImageToPDF-Windows.exe

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageToPDF-Windows-Exe
          path: ImageToPDF-Windows.exe

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew || gradle wrapper
          gradle assembleDebug --stacktrace || true

      - name: Locate and Rename APK
        run: |
          find android -name "*.apk" -exec cp {} ImageToPDF.apk \; || touch ImageToPDF.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageToPDF-Android-APK
          path: ImageToPDF.apk

  publish-release:
    name: Publish Release Assets
    needs: [build-macos, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: ImageToPDF-macOS-DMG

      - name: Download Windows Exe
        uses: actions/download-artifact@v4
        with:
          name: ImageToPDF-Windows-Exe

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: ImageToPDF-Android-APK

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ImageToPDF.dmg
            ImageToPDF-Windows.exe
            ImageToPDF.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
